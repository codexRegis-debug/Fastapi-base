services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    restart: always
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  api:
    build: .
    restart: always
    ports: ["8000:8000"]
    volumes: [".:/my_app"]
    entrypoint: []
    environment:
      #  FIXED: Changed localhost to db
      DATABASE_URL: postgresql+asyncpg://postgres:my-password@db:5432/my_app
      REDIS_URL: redis://redis:6379
      SECRET_KEY: j23iei3093oikedo39ied9ekei43er93oie
    depends_on: [db, redis]
    #  FIXED: Bypassing global python3 to call the explicit local binary layout
    command: python3 -m uvicorn my_app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  redisdata:
